- hosts: prometheus
  tasks:
  - name: Install GlusterFS
    apt:
      name: glusterfs-server
      state: present
      update_cache: yes
    become: true
  - name: Enable and start glusterd service
    systemd:
      name: glusterd
      enabled: yes
      state: started
    become: true
  - name: Create gluster directory
    file:
      path: /gluster
      state: directory
      owner: root
      group: root
    become: true
  - name: Create prometheus data directory
    file:
      path: /mnt/prometheus_data
      state: directory
      owner: root
      group: root
    become: true

  - name: Setup cluster
    shell: |
      gluster peer probe 10.0.0.20 || true
      gluster peer probe 10.0.0.21 || true
    become: true

- hosts: 10.0.0.20
  tasks:
  - name: Setup volume
    shell: |
      gluster volume create prometheus_volume replica 2 transport tcp 10.0.0.20:/gluster 10.0.0.21:/gluster force
      gluster volume start prometheus_volume
    become: true

- hosts: prometheus
  tasks:
  - name: Mount /gluster volume
    mount:
      name: /mnt/prometheus_data
      src: localhost:/prometheus_volume
      fstype: glusterfs
      opts: defaults,_netdev
      state: mounted
    become: true


